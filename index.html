<title>ARCH 6171 Integration Seminar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column; course map is a vertical stack of modules > weeks > items, like a drawing set's sheet index */
:root{
  --bg:#f7f8f6; --paper:#ffffff; --ink:#1b2320; --muted:#55615c; --line:#d6dcd8;
  --accent:#1f6f5c; --accent-soft:#e3f0eb;
  --c-lecture:#3b5ba5; --c-lab:#1f6f5c; --c-quiz:#a5603b; --c-assign:#7a3fa0; --c-break:#7d8782;
  --draft:#b07a12; --draft-soft:#fbf1dc;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a18; --paper:#1c2421; --ink:#e7ece9; --muted:#a3afaa; --line:#33403b;
  --accent:#5fc3a5; --accent-soft:#1f3a32;
  --c-lecture:#8fa8e8; --c-lab:#5fc3a5; --c-quiz:#e3a07a; --c-assign:#c49ae0; --c-break:#8c9792;
  --draft:#e7b54a; --draft-soft:#3a2f17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a18; --paper:#1c2421; --ink:#e7ece9; --muted:#a3afaa; --line:#33403b;
  --accent:#5fc3a5; --accent-soft:#1f3a32;
  --c-lecture:#8fa8e8; --c-lab:#5fc3a5; --c-quiz:#e3a07a; --c-assign:#c49ae0; --c-break:#8c9792;
  --draft:#e7b54a; --draft-soft:#3a2f17; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
.wrap{max-width:880px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:20px}
.brand{display:flex;flex-direction:column}
.brand a{color:inherit;text-decoration:none}
.code{font-family:var(--f-mono);font-size:13px;color:var(--muted);letter-spacing:.04em}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:28px}
h2{font-size:22px}
h3{font-size:18px}
.key{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.key input{font:inherit;font-family:var(--f-mono);font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink);width:150px}
.key button,.btn{font:inherit;font-size:14px;font-weight:500;padding:6px 12px;border-radius:4px;border:1px solid var(--accent);background:var(--accent);color:var(--paper);cursor:pointer}
.key button:disabled{opacity:.5;cursor:not-allowed}
.key small{color:var(--muted);font-size:12px;flex-basis:100%}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.intro{display:grid;gap:8px;margin-bottom:24px}
.intro p{margin:0;color:var(--muted);max-width:65ch}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:2px;display:inline-block}
.module{margin-top:28px}
.module>h2{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding-bottom:6px;border-bottom:1px solid var(--line)}
.module>h2 .code{font-size:13px}
.week{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.wk-no{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.wk-no b{display:block;font-family:var(--f-display);font-size:22px;color:var(--ink);font-weight:600}
.wk-body{min-width:0;display:grid;gap:8px}
.wk-head{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.wk-head a{color:inherit;text-decoration:none}
.wk-head a:hover h3{text-decoration:underline}
.wk-date{font-size:13px;color:var(--muted);font-family:var(--f-mono)}
.items{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;gap:6px;align-items:center;font-size:13px;padding:4px 10px 4px 8px;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:3px;background:var(--paper);color:var(--ink);text-decoration:none}
.chip:hover{border-color:var(--c)}
.chip .st{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.chip.draft .st{color:var(--draft)}
.chip.live .st{color:var(--accent)}
.week.break .wk-body{color:var(--muted)}
/* item + week pages */
.crumb{font-size:14px;margin-bottom:16px;display:flex;gap:6px;flex-wrap:wrap;color:var(--muted)}
.crumb a{color:var(--accent)}
.page-head{display:grid;gap:6px;padding-bottom:14px;border-bottom:2px solid var(--c,var(--ink));margin-bottom:18px}
.kind{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--c,var(--muted))}
.status{display:inline-block;font-family:var(--f-mono);font-size:12px;padding:2px 8px;border-radius:3px;background:var(--line);color:var(--ink);width:max-content}
.status.draft{background:var(--draft-soft);color:var(--draft)}
.status.live{background:var(--accent-soft);color:var(--accent)}
.dates{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:0 0 20px}
.dates div{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:8px 10px}
.dates dt{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dates dd{margin:0;font-family:var(--f-mono);font-size:14px}
.sec{display:grid;gap:6px;padding:14px 0;border-top:1px solid var(--line)}
.sec p{margin:0;max-width:65ch}
.ph{color:var(--muted);font-style:italic}
.tool{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--accent-soft);border:1px solid var(--accent);border-radius:6px;padding:14px 16px;margin:6px 0 4px}
.tool p{margin:0}
.btn{text-decoration:none;display:inline-block}
ul.plain{margin:0;padding-left:20px}
.list{display:grid;gap:6px}
.list a{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--c);background:var(--paper);border-radius:4px;color:var(--ink);text-decoration:none}
.list a:hover{border-color:var(--c)}
.list .st{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.who{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.who b{font-family:var(--f-mono)}
.who a,.linkbtn{color:var(--accent);background:none;border:0;padding:0;font:inherit;cursor:pointer;text-decoration:underline}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:grid;gap:10px;margin:10px 0}
.panel h3{margin:0}
.panel label{display:grid;gap:4px;font-size:14px}
.q{display:grid;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.q:first-child{border-top:0}
.q .prompt{font-weight:500}
.q label{display:flex;gap:8px;align-items:center}
.q input[type=text],.panel input[type=text],.panel select,.panel textarea{font:inherit;font-size:15px;padding:6px 10px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink)}
.panel textarea{width:100%;min-height:110px;font-family:var(--f-mono);font-size:13px}
.score{font-family:var(--f-display);font-size:32px;font-weight:600}
.msg{font-size:14px;color:var(--muted);margin:0}
.err{color:#b3261e}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td.mono{font-family:var(--f-mono)}
.ok{color:var(--accent)}
footer{margin-top:40px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
@media (max-width:520px){.week{grid-template-columns:1fr;gap:4px}.wk-no b{display:inline;margin-right:8px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><a href="#home"><span class="code">ARCH 6171 · SPRING 2027 · CU DENVER</span><h1>Integration Seminar</h1></a></div>
    <form class="key" id="keyForm">
      <label for="studentKey" class="code">ACCESS KEY</label>
      <input id="studentKey" placeholder="e.g. TR4K2-9XQPM" autocomplete="off" disabled>
      <button type="submit" disabled>Open</button>
      <small id="keyNote">Keys turn on once the course database is set up.</small>
    </form>
    <div class="who" id="who" hidden></div>
  </header>
  <main id="view"></main>
  <footer>Thursdays 9:30 AM to 12:15 PM. Quizzes due Sundays 11:59 PM, labs due Tuesdays 11:59 PM. Preview build: pages marked “Coming soon” are placeholders.</footer>
</div>

<script src="config.js"></script>
<script>
const KINDS={lecture:{label:"Lecture",c:"--c-lecture"},lab:{label:"Lab",c:"--c-lab"},quiz:{label:"Quiz",c:"--c-quiz"},assign:{label:"Assignment",c:"--c-assign"},crit:{label:"Crit day",c:"--c-assign"},folio:{label:"Folio",c:"--c-assign"}};
const START=new Date(2027,0,21); // Thursday of week 1
const day=(w,off=0)=>{const d=new Date(START);d.setDate(d.getDate()+(w-1)*7+off);return d};
const fmt=d=>d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});

const MODULES=[
  {id:"0",title:"Getting started",weeks:[1]},
  {id:"M1",title:"Module 1 · Site, climate and code",weeks:[2,3,4,5]},
  {id:"M2",title:"Module 2 · Form, energy, structure, MEP",weeks:[6,7,8,9,10]},
  {id:"M3",title:"Module 3 · Egress, access and details",weeks:[11,12,13,14]},
  {id:"F",title:"Folio and finals",weeks:[15,16,17]},
];
const S={soon:"Coming soon",draft:"Draft",live:"Live"};
// week data: topic, items
const W={
  1:{topic:"Introduction and the case building",items:[["lecture","soon","Course intro: labs, assignments, folio"]]},
  2:{topic:"Climate and site",items:[["lecture","soon","Reading a climate"],["lab","draft","Lab 1 · Climate Reader: Denver",{tool:true}],["quiz","draft","Quiz 1 · Trial run on your assigned city",{tool:true}]]},
  3:{topic:"Zoning, program and occupancy",items:[["lecture","soon","Zoning and program"],["lab","soon","Lab 2 · Zoning and program"],["quiz","soon","Quiz 2"]]},
  4:{topic:"Code path",items:[["lecture","soon","Construction type, height and area"],["lab","soon","Lab 3 · Code path"],["quiz","soon","Quiz 3"],["assign","soon","A01 · draft session"]]},
  5:{topic:"Crit 1",crit:"A01",items:[["crit","soon","A01 crit and peer review"],["assign","soon","A01 · Site, climate and code"]]},
  6:{topic:"Form and energy",items:[["lecture","soon","Form, energy and carbon"],["lab","soon","Lab 4 · Form and energy"],["quiz","soon","Quiz 4"]]},
  7:{topic:"Structure",items:[["lecture","soon","Structural systems"],["lab","soon","Lab 5 · Structure"],["quiz","soon","Quiz 5"]]},
  8:{topic:"Mechanical, electrical, plumbing",items:[["lecture","soon","MEP systems"],["lab","soon","Lab 6 · MEP"],["quiz","soon","Quiz 6"],["assign","soon","A02 · draft session"]]},
  9:{topic:"Crit 2",crit:"A02",items:[["crit","soon","A02 crit with engineer"],["assign","soon","A02 · Form, structure and systems"]]},
  10:{topic:"Spring break",brk:true,items:[]},
  11:{topic:"Egress and accessibility",items:[["lecture","soon","Egress and accessible routes"],["lab","soon","Lab 7 · Egress and access"],["quiz","soon","Quiz 7"]]},
  12:{topic:"Reading details",items:[["lecture","soon","Reading a wall section"],["lab","soon","Lab 8 · Reading details"],["quiz","soon","Quiz 8"]]},
  13:{topic:"Drafting details",items:[["lecture","soon","Drafting details"],["lab","soon","Lab 9 · Drafting details"],["quiz","soon","Quiz 9"],["assign","soon","A03 · draft session"]]},
  14:{topic:"Crit 3",crit:"A03",items:[["crit","soon","A03 crit and peer review"],["assign","soon","A03 · Egress, access and details"]]},
  15:{topic:"Folio pin-up",items:[["folio","soon","Folio pin-up review"]]},
  16:{topic:"Studio review week",brk:true,items:[]},
  17:{topic:"Finals",items:[["folio","soon","Final folio"]]},
};
const slug=(w,i)=>`wk-${w}-${i}`;
function dueFor(w,kind){
  const r={class:fmt(day(w))};
  if(w===17) return {window:"May 10 to May 15"};
  if(kind==="quiz") r.due=fmt(day(w,3))+", 11:59 PM";
  if(kind==="lab"){r.due=fmt(day(w,5))+", 11:59 PM";r.peer="By class "+fmt(day(w,7));}
  if(kind==="crit"){r.draft=fmt(day(w,-2))+", 11:59 PM";r.peer="Before class "+fmt(day(w));r.final=w===9?"After spring break (TBD)":fmt(day(w,5))+", 11:59 PM";}
  return r;
}
const LBL={class:"Class",due:"Due",peer:"Peer reviews",draft:"Draft due",final:"Final due",window:"Finals week"};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function chip(w,i,it){const[k,s,t]=it;const K=KINDS[k];return `<a class="chip ${s}" style="--c:var(${K.c})" href="#${slug(w,i)}">${esc(K.label)}<span class="st">${S[s]}</span></a>`}

function home(){
  let h=`<section class="intro"><p>The whole semester in one place. Each week has a short lecture, a lab you start in class, and a quiz. Labs build toward each module's assignment, and every module becomes a chapter of your folio.</p>
  <div class="legend">${["lecture","lab","quiz","assign"].map(k=>`<span><i class="dot" style="background:var(${KINDS[k].c})"></i>${KINDS[k].label}</span>`).join("")}<span>Status: <b>Live</b> · <b>Draft</b> · <b>Coming soon</b></span></div></section>`;
  for(const m of MODULES){
    h+=`<section class="module"><h2><span class="code">${m.id}</span>${esc(m.title)}</h2>`;
    for(const w of m.weeks){const d=W[w];
      h+=`<div class="week${d.brk?" break":""}"><div class="wk-no">WEEK<b>${String(w).padStart(2,"0")}</b></div><div class="wk-body">
      <div class="wk-head"><a href="#wk-${w}"><h3>${esc(d.topic)}</h3></a><span class="wk-date">${w===17?"May 10 to 15":"Thu "+fmt(day(w)).replace(/^\w+, /,"")}</span></div>
      ${d.items.length?`<div class="items">${d.items.map((it,i)=>chip(w,i,it)).join("")}</div>`:`<div class="wk-date">No class</div>`}</div></div>`;}
    h+=`</section>`;
  }
  return h;
}
function weekPage(w){const d=W[w];if(!d)return home();
  return `<nav class="crumb"><a href="#home">Course</a>/<span>Week ${w}</span></nav>
  <div class="page-head"><span class="kind">Week ${String(w).padStart(2,"0")}</span><h2>${esc(d.topic)}</h2><span class="wk-date">${w===17?"Finals week":"Class "+fmt(day(w))}</span></div>
  ${d.items.length?`<div class="list">${d.items.map((it,i)=>`<a href="#${slug(w,i)}" style="--c:var(${KINDS[it[0]].c})"><b>${KINDS[it[0]].label}</b> ${esc(it[2])}<span class="st">${S[it[1]]}</span></a>`).join("")}</div>`:`<p class="ph">No class this week.</p>`}
  <div class="sec"><h3>Week summary</h3><p class="ph">Introduction and timeline for this week go here.</p></div>`;
}
const SECTIONS={
  lecture:[["Introduction","Short framing of the topic and why it matters to your project."],["Key ideas","Diagrams and figures from the course library, with credit."],["Further reading","Links to pages in the private library (opens with your key)."]],
  lab:[["Introduction","What this lab teaches and how it feeds the module assignment."],["Learn","Interactive part: change an input, see the design effect."],["Core check","Auto-checked questions."],["Apply","Sizing and calculation on your project."],["Open move","One design move of your own."],["Further reading","Links to pages in the private library."],["Submit","Upload and peer review."]],
  quiz:[["Instructions","What to do, and how it is graded."],["Quiz","One attempt. You'll see your score and topics to review; answers open after the due date."]],
  assign:[["Brief","What you and your studio partner hand in."],["Steps","Labs that build into this assignment."],["Rubric","How it is graded."],["Submit","Draft, peer review, final."]],
  crit:[["Schedule","Peer review and small-group crit times."],["Peer review","Who you review and the review form."]],
  folio:[["What to hand in","Lab spreads plus assignment spreads, per module."],["Checklist","Final folio check."]],
};
const SPECIAL={
  "wk-2-1":`<div class="tool"><p><b>Climate Reader</b> · read Denver's climate, guess, reveal, pick strategies, export your climate kit.</p><a class="btn" href="climate-reader/index.html" target="_blank" rel="noopener">Open tool</a></div><p class="ph">Full student page is in draft in the Course Map.</p>`,
  "wk-2-2":`<div class="tool"><p><b>Climate Reader</b> · run it on your assigned city, then export the PDF checklist and upload it.</p><a class="btn" href="climate-reader/index.html" target="_blank" rel="noopener">Open tool</a></div><p class="ph">Full student page is in draft in the Course Map.</p>`,
};
function itemPage(w,i){const d=W[w];const it=d&&d.items[i];if(!it)return home();
  const[k,s,t]=it;const K=KINDS[k];const dd=dueFor(w,k);
  return `<nav class="crumb"><a href="#home">Course</a>/<a href="#wk-${w}">Week ${w}</a>/<span>${K.label}</span></nav>
  <div class="page-head" style="--c:var(${K.c})"><span class="kind">${K.label} · Week ${String(w).padStart(2,"0")}</span><h2>${esc(t)}</h2><span class="status ${s}">${S[s]}</span></div>
  <dl class="dates">${Object.entries(dd).map(([a,b])=>`<div><dt>${LBL[a]}</dt><dd>${esc(b)}</dd></div>`).join("")}</dl>
  ${SPECIAL[slug(w,i)]||""}
  ${(SECTIONS[k]||[]).map(([h,p])=>`<div class="sec"><h3>${h}</h3><p class="ph">${p}</p></div>`).join("")}`;
}
/* ---------- Course database (Supabase). Every call goes through a database function; tables are closed. ---------- */
const CFG=window.ARCH6171_CONFIG||{};
const DB_ON=!!(CFG.url&&CFG.key&&!/PASTE/.test(CFG.key));
const LS="arch6171-key";
const store={get(){try{return localStorage.getItem(LS)||""}catch(e){return ""}},set(v){try{v?localStorage.setItem(LS,v):localStorage.removeItem(LS)}catch(e){}}};
let ME=null, KEY=store.get();
async function rpc(fn,args){
  const h={"Content-Type":"application/json","apikey":CFG.key};
  if(/^eyJ/.test(CFG.key)) h.Authorization="Bearer "+CFG.key;
  const r=await fetch(`${CFG.url}/rest/v1/rpc/${fn}`,{method:"POST",headers:h,body:JSON.stringify(args)});
  const t=await r.text(); let j=null; try{j=t?JSON.parse(t):null}catch(e){}
  if(!r.ok) throw new Error((j&&(j.message||j.hint))||("Server error "+r.status));
  return j;
}
const quizIdFor=w=>`wk${String(w).padStart(2,"0")}-quiz`;

function paintWho(){
  const f=document.getElementById("keyForm"),who=document.getElementById("who"),inp=document.getElementById("studentKey"),btn=f.querySelector("button"),note=document.getElementById("keyNote");
  if(!DB_ON){f.hidden=false;who.hidden=true;return;}
  inp.disabled=false;btn.disabled=false;note.textContent="Your key stays with you all semester.";
  if(ME){f.hidden=true;who.hidden=false;
    who.innerHTML=`<span class="code">KEY</span><b>${esc(ME.label)}</b><a href="#me">My progress</a>${ME.role!=="student"?`<a href="#admin">${ME.role==="admin"?"Admin":"TA"}</a>`:""}<button class="linkbtn" id="signout" type="button">Sign out</button>`;
    document.getElementById("signout").onclick=()=>{ME=null;KEY="";store.set("");paintWho();route();};
  } else {f.hidden=false;who.hidden=true;}
}
async function signIn(k){
  const note=document.getElementById("keyNote");
  try{ME=await rpc("whoami",{p_code:k});KEY=k;store.set(k);paintWho();route();}
  catch(e){ME=null;note.innerHTML=`<span class="err">${esc(e.message)}</span>`;}
}
document.getElementById("keyForm").addEventListener("submit",e=>{e.preventDefault();const k=document.getElementById("studentKey").value.trim();if(k)signIn(k);});

function needKey(){return DB_ON?`<p class="msg">Enter your access key at the top of the page to open this.</p>`:`<p class="msg">This opens once the course database is set up.</p>`;}

/* ---------- Quiz ---------- */
async function mountQuiz(el,quizId){
  if(!ME){el.innerHTML=needKey();return;}
  el.innerHTML=`<p class="msg">Loading…</p>`;
  let q; try{q=await rpc("get_quiz",{p_code:KEY,p_quiz:quizId});}
  catch(e){el.innerHTML=`<p class="msg">${/No such quiz/.test(e.message)?"This quiz isn't open yet.":esc(e.message)}</p>`;return;}
  const due=new Date(q.due_at).toLocaleString("en-US",{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
  if(q.submitted){
    el.innerHTML=`<div class="panel"><span class="kind">Submitted</span><div class="score">${q.score} / ${q.max_score}</div>
      ${q.missed_topics&&q.missed_topics.length?`<p>Topics to review: <b>${q.missed_topics.map(esc).join(", ")}</b></p>`:`<p class="ok">Nothing to review.</p>`}
      ${q.answers_open?`<button class="btn" id="rev" type="button">See the answers</button><div id="revOut"></div>`:`<p class="msg">Correct answers open after the due date, ${esc(due)}.</p>`}</div>`;
    const b=el.querySelector("#rev"); if(b) b.onclick=()=>showReview(el.querySelector("#revOut"),quizId);
    return;
  }
  const qs=q.questions||[];
  el.innerHTML=`<div class="panel"><p class="msg">Due ${esc(due)}. One attempt: once you submit, it locks.</p>
    <form id="qf">${qs.map((it,i)=>`<div class="q"><div class="prompt">${i+1}. ${esc(it.prompt)}</div>${
      it.options?it.options.map(o=>`<label><input type="${it.multi?"checkbox":"radio"}" name="${esc(it.id)}" value="${esc(o)}"> ${esc(o)}</label>`).join("")
      :`<input type="text" name="${esc(it.id)}" inputmode="${it.text?"text":"decimal"}" autocomplete="off">`}</div>`).join("")}
    <button class="btn" type="submit">Submit quiz</button> <span class="msg" id="qmsg"></span></form>${ME.role!=="student"?`<p class="msg">You're signed in as ${esc(ME.role.toUpperCase())}, so you can look but not submit.</p>`:""}</div>`;
  el.querySelector("#qf").onsubmit=async e=>{e.preventDefault();const f=e.target,ans={};
    for(const it of qs){
      if(it.options&&it.multi) ans[it.id]=[...f.querySelectorAll(`input[name="${CSS.escape(it.id)}"]:checked`)].map(x=>x.value);
      else if(it.options){const c=f.querySelector(`input[name="${CSS.escape(it.id)}"]:checked`);if(c)ans[it.id]=c.value;}
      else {const v=f.elements[it.id].value.trim();if(v)ans[it.id]=v;}
    }
    const blank=qs.length-Object.keys(ans).filter(k=>!(Array.isArray(ans[k])&&!ans[k].length)).length;
    if(!confirm((blank?`${blank} question${blank>1?"s are":" is"} blank. `:"")+"You get one attempt. Submit now?"))return;
    f.querySelector("button").disabled=true;
    try{await rpc("submit_quiz",{p_code:KEY,p_quiz:quizId,p_answers:ans});mountQuiz(el,quizId);}
    catch(err){f.querySelector("button").disabled=false;document.getElementById("qmsg").innerHTML=`<span class="err">${esc(err.message)}</span>`;}
  };
}

/* ---------- Admin and TA ---------- */
function download(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:type||"text/csv"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
const csvCell=v=>{v=v==null?"":String(v);return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v;};
const toCSV=rows=>rows.map(r=>r.map(csvCell).join(",")).join("\n");
function parseCSV(t){const out=[];let row=[],cur="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
  else if(c==='"')q=true;else if(c===","){row.push(cur);cur="";}else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(cur);out.push(row);row=[];cur="";}else cur+=c;}
  if(cur||row.length){row.push(cur);out.push(row);}return out.filter(r=>r.some(x=>x.trim()));}
function expandLabels(s){const out=[];for(const part of s.split(/[\s,]+/).filter(Boolean)){const m=part.match(/^([A-Za-z]*)(\d+)-\1?(\d+)$/);
  if(m){const w=Math.max(m[2].length,m[3].length);for(let n=+m[2];n<=+m[3];n++)out.push(m[1]+String(n).padStart(w,"0"));}else out.push(part);}return out;}
const readFile=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result));r.onerror=rej;r.readAsText(f);});

async function mountAdmin(el){
  if(!ME){el.innerHTML=needKey();return;}
  if(ME.role==="student"){el.innerHTML=`<p class="msg">This page is for the instructor and TA.</p>`;return;}
  const admin=ME.role==="admin";
  el.innerHTML=`
  <div class="panel"><h3>Grades for Canvas</h3>
    <p class="msg">Pick two files from your computer. They're read here in your browser and never uploaded.</p>
    <label>1. Your key list (the CSV from “Make keys”, with the canvas_id column filled in) <input type="file" id="fRoster" accept=".csv"></label>
    <label>2. Canvas gradebook export (Grades › Export) <input type="file" id="fCanvas" accept=".csv"></label>
    <div><button class="btn" id="bCanvas" type="button">Make Canvas import file</button> <button class="linkbtn" id="bPlain" type="button">or download scores by key</button></div>
    <p class="msg" id="gMsg"></p></div>
  ${admin?`<div class="panel"><h3>Make keys</h3>
    <p class="msg">Labels only, no names. Use a range like S01-S44, or a list. Each key is shown once, so download the list and keep it private.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><select id="kRole"><option value="student">Students</option><option value="ta">TA</option><option value="admin">Admin</option></select><input type="text" id="kLabels" placeholder="S01-S44"><button class="btn" id="bKeys" type="button">Make keys</button></div>
    <div id="kOut"></div></div>
  <div class="panel"><h3>Add or replace a quiz</h3><p class="msg">Paste quiz text from Claude.</p><textarea id="qJson" spellcheck="false"></textarea><div><button class="btn" id="bQuiz" type="button">Save quiz</button> <span class="msg" id="qMsg"></span></div></div>
  <div class="panel"><h3>Weekly backup</h3><p class="msg">Downloads everything as one file. Labels only, no keys.</p><div><button class="btn" id="bBackup" type="button">Download backup</button> <span class="msg" id="bMsg"></span></div></div>
  <div class="panel"><h3>Test the quiz lock</h3><p class="msg">Make a student key labelled TEST, sign in with it, and try the <a href="#quiz-practice">practice quiz</a> twice.</p></div>`:""}`;
  const gMsg=el.querySelector("#gMsg");
  const getGrades=async()=>{const g=await rpc("grades",{p_code:KEY});if(!g.length)throw new Error("No quiz scores yet.");return g;};
  el.querySelector("#bPlain").onclick=async()=>{try{const g=await getGrades();const quizzes=[...new Set(g.map(r=>r.quiz_id))],by={};
      g.forEach(r=>{(by[r.label]=by[r.label]||{})[r.quiz_id]=r.score;});
      download("arch6171-scores-by-key.csv",toCSV([["label",...quizzes],...Object.keys(by).sort().map(l=>[l,...quizzes.map(q=>by[l][q]??"")])]));gMsg.textContent="Downloaded.";}
    catch(e){gMsg.innerHTML=`<span class="err">${esc(e.message)}</span>`;}};
  el.querySelector("#bCanvas").onclick=async()=>{try{
      const fr=el.querySelector("#fRoster").files[0],fc=el.querySelector("#fCanvas").files[0];
      if(!fr||!fc)throw new Error("Pick both files first.");
      const roster=parseCSV(await readFile(fr)),canvas=parseCSV(await readFile(fc));
      const rh=roster[0].map(x=>x.trim().toLowerCase()),li=rh.indexOf("label"),ci=rh.indexOf("canvas_id");
      if(li<0||ci<0)throw new Error("The key list needs label and canvas_id columns.");
      const idByLabel={};roster.slice(1).forEach(r=>{if(r[ci]&&r[ci].trim())idByLabel[r[li].trim()]=r[ci].trim();});
      const ch=canvas[0],idI=ch.indexOf("ID");if(idI<0)throw new Error("That doesn't look like a Canvas gradebook export (no ID column).");
      const fixed=["Student","ID","SIS User ID","SIS Login ID","Section"].filter(c=>ch.includes(c));
      const rowById={};canvas.slice(1).forEach(r=>{if(/^\d+$/.test((r[idI]||"").trim()))rowById[r[idI].trim()]=r;});
      const g=await getGrades(),titles={};
      const quizzes=[...new Set(g.map(r=>r.quiz_id))];
      // match each quiz to a Canvas column whose name starts with the quiz id or title; otherwise a new column
      const colFor=q=>ch.find(h=>h.toLowerCase().startsWith(q.toLowerCase()))||q;
      const cols=quizzes.map(colFor);
      const by={};g.forEach(r=>{const id=idByLabel[r.label];if(id)(by[id]=by[id]||{})[r.quiz_id]=r.score;});
      const missing=[...new Set(g.filter(r=>!idByLabel[r.label]).map(r=>r.label))];
      const out=[[...fixed,...cols]];
      Object.keys(by).forEach(id=>{const src=rowById[id];if(!src){missing.push("canvas_id "+id);return;}out.push([...fixed.map(c=>src[ch.indexOf(c)]),...quizzes.map(q=>by[id][q]??"")]);});
      download("arch6171-canvas-import.csv",toCSV(out));
      gMsg.innerHTML=`Downloaded, ${out.length-1} students. In Canvas: Grades › Import.`+(missing.length?` <span class="err">Not matched: ${missing.map(esc).join(", ")}.</span>`:"");
    }catch(e){gMsg.innerHTML=`<span class="err">${esc(e.message)}</span>`;}};
  if(!admin)return;
  el.querySelector("#bKeys").onclick=async()=>{const out=el.querySelector("#kOut");try{
      const labels=expandLabels(el.querySelector("#kLabels").value);if(!labels.length)throw new Error("Type at least one label.");
      if(labels.length>80)throw new Error("Up to 80 at a time.");
      const rows=await rpc("add_people",{p_code:KEY,p_role:el.querySelector("#kRole").value,p_labels:labels});
      const csv=toCSV([["label","access_key","canvas_id"],...rows.map(r=>[r.label,r.access_key,""])]);
      out.innerHTML=`<p><b>${rows.length} keys made.</b> Download the list now: they won't be shown again.</p><button class="btn" id="bKeyCsv" type="button">Download key list</button>
        <table class="t"><tr><th>Label</th><th>Key</th></tr>${rows.map(r=>`<tr><td>${esc(r.label)}</td><td class="mono">${esc(r.access_key)}</td></tr>`).join("")}</table>`;
      out.querySelector("#bKeyCsv").onclick=()=>download("arch6171-keys-PRIVATE.csv",csv);
    }catch(e){out.innerHTML=`<p class="err">${esc(/duplicate|unique/i.test(e.message)?"One of those labels already has a key.":e.message)}</p>`;}};
  el.querySelector("#bQuiz").onclick=async()=>{const m=el.querySelector("#qMsg");try{const q=JSON.parse(el.querySelector("#qJson").value);
      if(!q.id||!q.title||!q.due_at)throw new Error("Needs id, title and due_at.");
      await rpc("upsert_quiz",{p_code:KEY,p_quiz:q});m.innerHTML=`<span class="ok">Saved ${esc(q.id)}.</span>`;}
    catch(e){m.innerHTML=`<span class="err">${esc(e instanceof SyntaxError?"That isn't valid quiz text.":e.message)}</span>`;}};
  el.querySelector("#bBackup").onclick=async()=>{const m=el.querySelector("#bMsg");try{const b=await rpc("backup",{p_code:KEY});
      download(`arch6171-backup-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(b,null,1),"application/json");m.textContent="Downloaded.";}
    catch(e){m.innerHTML=`<span class="err">${esc(e.message)}</span>`;}};
}

    const it=W[+m[1]]&&W[+m[1]].items[+m[2]];
    if(it&&it[0]==="quiz"){const box=[...v.querySelectorAll(".sec")].find(s=>/^Quiz$/.test(s.querySelector("h3").textContent));
      if(box){const d=document.createElement("div");box.appendChild(d);mountQuiz(d,quizIdFor(+m[1]));}}}
  else if(m=h.match(/^wk-(\d+)$/)) v.innerHTML=weekPage(+m[1]);
  else if(h==="me"){v.innerHTML=`<nav class="crumb"><a href="#home">Course</a>/<span>My progress</span></nav><div class="page-head"><span class="kind">${ME?esc(ME.label):"Progress"}</span><h2>My progress</h2></div><div id="m"></div>`;mountMe(v.querySelector("#m"));}

  else if(m=h.match(/^quiz-([\w-]+)$/)){v.innerHTML=`<nav class="crumb"><a href="#home">Course</a>/<span>Quiz</span></nav><div class="page-head" style="--c:var(--c-quiz)"><span class="kind">Quiz</span><h2>${esc(m[1]==="practice"?"Practice quiz":m[1])}</h2></div><div id="qz"></div>`;mountQuiz(v.querySelector("#qz"),m[1]);}
  else v.innerHTML=home();
  window.scrollTo(0,0);
}
